apiVersion: batch/v1
kind: Job
metadata:
  name: service-order-service-db-migrate
  labels:
    app: service-order-service-db-migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: service-order-service-db-migrate
    spec:
      restartPolicy: OnFailure
      # migrate/migrate does not wait for the DB; block until it accepts conns.
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do echo 'waiting for database...'; sleep 2; done
          envFrom:
            - configMapRef:
                name: service-order-service-config
            - secretRef:
                name: service-order-service-secrets
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.1
          # k8s substitutes $(VAR) from the container env at runtime.
          args:
            - -path=/migrations
            - -database=postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode=$(POSTGRES_SSLMODE)
            - up
          envFrom:
            - configMapRef:
                name: service-order-service-config
            - secretRef:
                name: service-order-service-secrets
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        # service-order-service-migrations is created by the deploy workflow from
        # the repo's migrations/ dir, so SQL is not copied into the manifests tree.
        - name: migrations
          configMap:
            name: service-order-service-migrations
