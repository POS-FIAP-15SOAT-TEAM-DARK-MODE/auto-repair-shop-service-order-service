apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-repair-shop

# No in-cluster Postgres: the database is RDS (Terraform). The Secret
# service-order-service-secrets is produced by the External Secrets Operator (secrets.yaml).
resources:
  - ../../base
  - secrets.yaml

components:
  - ../../components/observability

# Image published to ECR. The pipeline overrides newTag with the commit SHA.
images:
  - name: auto-repair-shop-service-order-service
    newName: 000000000000.dkr.ecr.us-east-1.amazonaws.com/auto-repair-shop-service-order-service
    newTag: latest

patches:
  - path: patch-configmap.yaml
    target:
      kind: ConfigMap
      name: service-order-service-config
  - path: patch-hpa.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: service-order-service
