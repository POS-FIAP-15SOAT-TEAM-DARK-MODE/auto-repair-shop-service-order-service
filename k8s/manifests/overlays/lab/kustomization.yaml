apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-repair-shop

# Restricted-account (AWS Academy Learner Lab) overlay. No Ingress and no
# External Secrets: IRSA is unavailable there. The Secret
# service-order-service-secrets is created by the pipeline from Secrets Manager.
# Services are ClusterIP.
resources:
  - ../../base

components:
  - ../../components/observability

patches:
  - path: patch-configmap.yaml
    target:
      kind: ConfigMap
      name: service-order-service-config
